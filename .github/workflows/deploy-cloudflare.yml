name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply pending D1 migrations before deployment
        required: true
        default: true
        type: boolean
      sync_openai_secret:
        description: Sync the optional OPENAI_API_KEY GitHub secret to the Worker
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Validate required deployment secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm exec tsc -- --noEmit

      - name: Test
        run: npm test

      - name: Build Cloudflare Worker bundle
        run: npm run build:worker

      - name: Apply D1 migrations
        if: ${{ inputs.apply_migrations }}
        run: npm run db:migrate:remote

      - name: Deploy application
        run: npm run deploy:worker

      - name: Check optional OpenAI secret
        if: ${{ inputs.sync_openai_secret }}
        id: openai-secret
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if test -n "$OPENAI_API_KEY"; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No GitHub OPENAI_API_KEY was synced. Existing Worker secrets, if any, are unchanged."
          fi

      - name: Sync OpenAI runtime secret
        if: ${{ inputs.sync_openai_secret && steps.openai-secret.outputs.configured == 'true' }}
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: printf '%s' "$OPENAI_API_KEY" | npx --no-install wrangler secret put OPENAI_API_KEY
